# ============================================
# Blueprint Render — Juridico API
# ============================================
# Deploy: conecte este repo ao Render
# e faça deploy deste blueprint (New → Import Blueprint)
#
# PASSO A PASSO:
#  1. Crie conta em https://render.com
#  2. Fork este repo no GitHub (ou push direto)
#  3. No Render: New → Import Blueprint → selecione este render.yaml
#  4. O Render vai criar: juridico-api + Postgres + Redis
#  5. Depois do deploy: configure JWT_SECRET manualmente
#     (Dashboard do Render → API → Environment → Add Secret)
# ============================================

apiVersion: '1'
services:
  - type: web
    name: juridico-api
    env: node
    region: sao-paulo
    plan: free
    rootDir: minha-api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
        # PREENCHA MANUALMENTE no Dashboard do Render (sync: false)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
        # O Render vai criar automatically se usar Import Blueprint
      - key: DATABASE_URL
        sync: false
      - key: DB_DIALECT
        value: postgres
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        # Depois do deploy do frontend, cole aqui a URL do Vercel
        sync: false
      - key: DATAJUD_API_KEY
        sync: false
      - key: DATAJUD_MOCK
        value: 'false'
      - key: DATAJUD_USE_LEGACY
        value: 'false'
      - key: LOG_LEVEL
        value: warn

databases:
  - name: juridico-postgres
    plan: free
    region: sao-paulo
    ipAllowList: []

redis:
  - name: juridico-redis
    plan: starter
    region: sao-paulo
    ipAllowList: []
